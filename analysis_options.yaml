include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    invalid_annotation_target: ignore # Útil ao usar Freezed / JsonSerializable
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - web/**

linter:
  rules:
    # Desativa a obrigatoriedade de documentar todos os membros públicos
    # (recomenda-se desativar para apps finais; manter apenas se for criar um package/design system)
    public_member_api_docs: false

    # Regras de ouro para performance e clean code em Flutter:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_build_context_synchronously: true
    unawaited_futures: true
    avoid_void_async: true
    cancel_subscriptions: true